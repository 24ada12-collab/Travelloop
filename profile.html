{% extends 'base.html' %}
{% block title %}Profile — Traveloop{% endblock %}
{% block topbar_title %}My Profile{% endblock %}

{% block content %}

<div style="max-width:700px;">

  <div class="card">

    <div style="text-align:center;margin-bottom:24px;">

      <div class="user-avatar"
           style="width:90px;height:90px;font-size:32px;margin:auto;margin-bottom:12px;">
        {{ user.first_name[0] }}
      </div>

      <h2 class="font-display">
        {{ user.first_name }} {{ user.last_name }}
      </h2>

      <div class="text-muted">
        {{ user.email }}
      </div>

    </div>

    <form method="POST">

      <div class="form-row">

        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text"
                 name="first_name"
                 class="form-control"
                 value="{{ user.first_name }}">
        </div>

        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text"
                 name="last_name"
                 class="form-control"
                 value="{{ user.last_name }}">
        </div>

      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email"
               name="email"
               class="form-control"
               value="{{ user.email }}">
      </div>

      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="text"
               name="phone"
               class="form-control"
               value="{{ user.phone }}">
      </div>

      <div class="form-group">
        <label class="form-label">Bio</label>
        <textarea name="bio"
                  class="form-control">{{ user.bio }}</textarea>
      </div>

      <button type="submit" class="btn btn-primary">
        Save Changes
      </button>

    </form>

  </div>

</div>

{% endblock %}
